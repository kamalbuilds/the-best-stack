name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the recommender
        run: node site/engine.test.mjs
      - name: Assemble the site
        run: |
          mkdir -p _site/data
          cp site/index.html site/app.js site/engine.js site/style.css site/og.png _site/
          cp data/stack.json data/stats.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
