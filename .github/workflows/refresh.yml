name: refresh

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "README.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate picks and regenerate tables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh.mjs
      - name: Open a pull request with the new numbers
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: refresh/monthly
          title: "Monthly refresh: versions, stars and model prices"
          commit-message: "Refresh versions, stars and model prices"
          body: Generated by scripts/refresh.mjs. Review the diff for picks that went stale before merging.
